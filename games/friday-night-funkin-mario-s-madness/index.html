<script>
window.offlineAdCleanup = true;
function removeOfflineAds() {
  document.querySelectorAll('iframe, ins, [id], [class]').forEach(function(el) {
    var v = ((el.id || '') + ' ' + (el.className || '') + ' ' + (el.getAttribute('src') || '')).toLowerCase();
    var adName = /(sidebarad|mobilead|adcontainer|adslot|adsbygoogle|adbanner|adsbox|my_ad|gamemonetize|adinplay|doubleclick|googlesyndication|imasdk|(^|[\\s_-])(ad|ads|advert|advertisement|banner)([\\s_-]|$))/i.test(v);
    var remoteFrame = el.tagName === 'IFRAME' && /^(https?:|\/\/)/i.test(el.getAttribute('src') || '');
    if (adName || remoteFrame) el.remove();
  });
}
removeOfflineAds();
new MutationObserver(removeOfflineAds).observe(document.documentElement, {childList:true, subtree:true});
window.showAd = window.showAds = window.showAdOnClick = function() { return false; };
window.showBannerAd = window.showRewardedAd = window.showInterstitialAd = function() { return Promise.resolve(false); };

<script>
(function(){
  function nav(){
    if(document.getElementById("fnf-nav"))return;
    var wrap=document.createElement("div");wrap.id="fnf-nav";
    var p=location.pathname,i=p.indexOf("/games/");
    var root=i>=0?p.slice(0,i+1):p.replace(/[^/]*$/,"");
    var back=document.createElement("a");back.textContent="\u2190";back.title="Back to games";
    back.href=root+"mods.html";
    var nt=document.createElement("a");nt.textContent="\u2197";nt.title="Open in new tab";
    nt.href=location.href;nt.target="_blank";nt.rel="noopener";
    var fs=document.createElement("button");fs.textContent="\u26f6";fs.title="Fullscreen";
    fs.onclick=function(){if(document.fullscreenElement)document.exitFullscreen();else(document.documentElement.requestFullscreen||function(){}).call(document.documentElement);};
    wrap.appendChild(back);wrap.appendChild(nt);wrap.appendChild(fs);
    (document.body||document.documentElement).appendChild(wrap);
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",nav);
  else nav();
})();
</script>
