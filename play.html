<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play — FNF</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="play-page">
  <div id="gate">
    <div id="gate-bg"></div>
    <div id="gate-inner">
      <img id="gate-cover" alt="" />
      <div id="gate-name">Loading…</div>
      <button id="gate-play">CLICK TO PLAY</button>
    </div>
  </div>

  <div class="play-fab">
    <a class="home-btn" href="index.html" title="Home" aria-label="Home"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg></a>
    <button id="btn-back" class="back" title="Back" aria-label="Back"></button>
  </div>

  <script src="settings.js?v=2"></script>
  <script src="nav.js?v=2"></script>

  <script>
    const params = new URLSearchParams(location.search);
    const slug = params.get("g") || "friday-night-funkin";
    const CDN = "https://rawcdn.githack.com/Camzzz-vrgt/fnf-unblocked/9b26e7c953ed80a82f4ac9c5864491dcaf90bea9/";
    const GAME_HOST_DEFAULT = "http://127.0.0.1:8642";
    const gameHost = () =>
      (window.FNFSettings && FNFSettings.get("game-host", "")) || GAME_HOST_DEFAULT;

    function gateHtml(title, sub) {
      return '<!doctype html><meta charset="utf-8"><title>' + title +
        '</title><body style="margin:0;background:#0c0714;color:#eee;' +
        'display:flex;align-items:center;justify-content:center;' +
        'height:100vh;font-family:sans-serif"><div style=' +
        '"text-align:center"><h2>' + title + '</h2><p style=' +
        '"color:#9a92b8">' + sub + '</p></div>';
    }
    async function launchGame(slug) {
      let w = null;
      try { w = window.open("about:blank", "_blank"); } catch (e) {}
      const t = w || window;
      try {
        t.document.open();
        t.document.write(gateHtml("loading " + slug + "…",
          "pulling the game from the cdn"));
        t.document.close();
      } catch (e) {}
      try {
        const url = CDN + "pkg/" + encodeURIComponent(slug) + "/index.html";
        const r = await fetch(url);
        if (!r.ok) throw new Error("cdn " + r.status);
        let html = await r.text();
        const base = `<base href="${CDN}pkg/${encodeURIComponent(slug)}/">`;
        html = /<base[^>]*>/i.test(html)
          ? html.replace(/<base[^>]*>/i, base)
          : html.replace(/<head[^>]*>/i, m => m + base);
        const u2 = URL.createObjectURL(new Blob([html],
          { type: "text/html" }));
        if (w) w.location.href = u2; else location.href = u2;
      } catch (e) {
        const u = gameHost() + "/games/" + encodeURIComponent(slug) + "/";
        try {
          t.document.open();
          t.document.write(gateHtml("cdn failed — " + e.message,
            "trying your local game host…"));
          t.document.close();
        } catch (e2) {}
        setTimeout(() => { if (w) w.location.href = u;
          else location.href = u; }, 900);
      }
    }

    // click-to-play gate: the click is the user gesture browsers require
    // before a page can unlock its AudioContext — without it the game's
    // sound decoding stalls and the loading bar crawls for a minute.
    const gate = document.getElementById("gate");
    const gameInfo = fetch("data/games.json").then(r => r.json())
      .then(games => games.find(x => x.slug === slug) || null)
      .catch(() => null);

    const start = () => {
      if (window.__bgm) __bgm.pause();
      launchGame(slug);
    };
    if (window.__bgm) __bgm.pause();
    document.getElementById("gate-play").onclick = start;
    gate.onclick = e => { if (e.target.id === "gate" || e.target.id === "gate-bg") start(); };

    gameInfo.then(g => {
      if (g) {
        document.title = g.name + " — FNF";
        document.getElementById("gate-name").textContent = g.name;
        if (g.cover) {
          document.getElementById("gate-cover").src = g.cover + "?v=4";
          document.getElementById("gate-bg").style.backgroundImage = `url("${g.cover}?v=4")`;
        }
      }
      if (window.FNFSettings) FNFSettings.applyCloak(); // cloak beats game title
    });

    document.getElementById("btn-back").onclick = () => { location.href = "mods.html"; };
  </script>
</body>
</html>
