<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Mods — FNF</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="mods-page">
  <header class="topbar">
    <a class="back" href="index.html" aria-label="Back"></a>
    <img class="topbar-logo" src="assets/modstext.png" alt="Mods" />
    <span id="game-count" class="game-count"></span>
    <input id="search" type="search" placeholder="search mods..." autocomplete="off" />
  </header>

  <main id="grid" class="grid" aria-live="polite"></main>
  <p id="empty" class="empty hidden">no mods match that search</p>

  <script>
    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const search = document.getElementById("search");
    let games = [];

    function render(list) {
      grid.innerHTML = "";
      empty.classList.toggle("hidden", list.length > 0);
      for (const g of list) {
        const a = document.createElement("a");
        a.className = "card" + (g.base ? " card-base" : "");
        a.href = "play.html?g=" + encodeURIComponent(g.slug);
        const art = document.createElement("div");
        art.className = "card-art";
        if (g.cover) {
          const img = document.createElement("img");
          img.src = g.cover + "?v=4";
          img.alt = "";
          img.loading = "lazy";
          img.onerror = () => art.classList.add("no-img");
          art.appendChild(img);
        } else {
          art.classList.add("no-img");
        }
        const span = document.createElement("span");
        span.className = "card-fallback";
        span.textContent = g.name;
        art.appendChild(span);
        const label = document.createElement("div");
        label.className = "card-name";
        label.textContent = g.name;
        a.append(art, label);
        grid.appendChild(a);
      }
    }

    search.addEventListener("input", () => {
      const q = search.value.trim().toLowerCase();
      render(q ? games.filter(g => g.name.toLowerCase().includes(q)) : games);
    });

    fetch("data/games.json").then(r => r.json()).then(data => {
      games = data;
      document.getElementById("game-count").textContent = games.length + " games";
      render(games);
    });
  </script>
  <script src="settings.js?v=2"></script>
  <script src="nav.js?v=2"></script>
  <script src="bgm.js?v=2"></script>
  <script src="sfx.js?v=2"></script>
</body>
</html>
